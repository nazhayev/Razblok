<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razblok — Разблокировка банковских карт 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: #151b2b;
      --bg-card-hover: #1a2235;
      --border-subtle: rgba(148,163,184,0.08);
      --border-medium: rgba(148,163,184,0.15);
      --border-accent: rgba(59,130,246,0.3);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --gradient-blue: linear-gradient(135deg, #3b82f6, #1d4ed8);
      --gradient-purple: linear-gradient(135deg, #8b5cf6, #6d28d9);
      --gradient-green: linear-gradient(135deg, #22c55e, #16a34a);
      --gradient-amber: linear-gradient(135deg, #f59e0b, #d97706);
      --gradient-red: linear-gradient(135deg, #ef4444, #dc2626);
      --gradient-cyan: linear-gradient(135deg, #06b6d4, #0891b2);
      --gradient-pink: linear-gradient(135deg, #ec4899, #db2777);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }
    .hero {
      text-align: center;
      padding: 70px 20px 50px;
      position: relative;
      border-bottom: 1px solid var(--border-subtle);
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -150px; left: 50%;
      transform: translateX(-50%);
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      color: #4ade80;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }
    .hero-badge .dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }
    .hero h1 {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .hero p {
      font-size: 18px;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }
    .stepper {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: default;
      border: 2px solid transparent;
    }
    .step.active {
      background: var(--gradient-blue);
      color: white;
      box-shadow: 0 4px 25px rgba(59,130,246,0.35);
      border-color: rgba(255,255,255,0.1);
    }
    .step.completed {
      background: rgba(34,197,94,0.1);
      color: #4ade80;
      border: 2px solid rgba(34,197,94,0.25);
    }
    .step.pending {
      background: rgba(148,163,184,0.05);
      color: var(--text-muted);
      border: 2px solid var(--border-subtle);
    }
    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
    }
    .step.active .step-num { background: rgba(255,255,255,0.2); }
    .step.completed .step-num { background: rgba(34,197,94,0.2); }
    .step.pending .step-num { background: rgba(148,163,184,0.1); }
    .tips-bar {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tip-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .tip-pill:hover {
      border-color: var(--border-medium);
      transform: translateY(-1px);
    }
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }
    .section-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      letter-spacing: -0.01em;
    }
    .section-title .icon-wrap {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .icon-blue { background: var(--gradient-blue); }
    .icon-purple { background: var(--gradient-purple); }
    .icon-green { background: var(--gradient-green); }
    .icon-amber { background: var(--gradient-amber); }
    .icon-red { background: var(--gradient-red); }
    .icon-cyan { background: var(--gradient-cyan); }
    .bank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 50px;
    }
    .bank-card {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .bank-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: var(--gradient-blue);
      transform: scaleX(0);
      transition: transform 0.35s ease;
      border-radius: 0 0 20px 20px;
    }
    .bank-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(59,130,246,0.12);
      background: var(--bg-card-hover);
    }
    .bank-card:hover::after { transform: scaleX(1); }
    .bank-card.selected {
      border-color: var(--accent-blue);
      background: rgba(59,130,246,0.08);
      box-shadow: 0 0 40px rgba(59,130,246,0.15), inset 0 0 0 1px rgba(59,130,246,0.2);
    }
    .bank-card.selected::after { transform: scaleX(1); }
    .bank-card .bank-logo {
      width: 56px; height: 56px;
      border-radius: 16px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .bank-sber { background: linear-gradient(135deg, #21a038, #1a8a2e); color: white; }
    .bank-tinkoff { background: linear-gradient(135deg, #ffdd2d, #f5c800); color: #1a1a1a; }
    .bank-vtb { background: linear-gradient(135deg, #002882, #001a5c); color: white; }
    .bank-alfa { background: linear-gradient(135deg, #ef3124, #d42a1f); color: white; }
    .bank-gazprom { background: linear-gradient(135deg, #0079c2, #0062a0); color: white; }
    .bank-raiff { background: linear-gradient(135deg, #ffed00, #e6d500); color: #1a1a1a; }
    .bank-card .bank-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .block-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      margin-bottom: 50px;
    }
    .block-card {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 24px;
      padding: 28px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .block-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .block-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      background: var(--bg-card-hover);
    }
    .block-card:hover::before { opacity: 1; }
    .block-card.selected {
      box-shadow: 0 0 40px rgba(59,130,246,0.1), inset 0 0 0 1px rgba(59,130,246,0.15);
    }
    .block-card.selected::before { opacity: 1; }
    .block-card .block-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .block-card h3 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .block-card p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .block-card .block-tag {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tag-easy { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
    .tag-medium { background: rgba(245,158,11,0.12); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); }
    .tag-hard { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }
    .bc-pin { border-color: rgba(59,130,246,0.15); }
    .bc-pin:hover { border-color: rgba(59,130,246,0.4); }
    .bc-pin::before { background: var(--gradient-blue); }
    .bc-pin.selected { border-color: rgba(59,130,246,0.5); }
    .bc-expiry { border-color: rgba(139,92,246,0.15); }
    .bc-expiry:hover { border-color: rgba(139,92,246,0.4); }
    .bc-expiry::before { background: var(--gradient-purple); }
    .bc-expiry.selected { border-color: rgba(139,92,246,0.5); }
    .bc-client { border-color: rgba(34,197,94,0.15); }
    .bc-client:hover { border-color: rgba(34,197,94,0.4); }
    .bc-client::before { background: var(--gradient-green); }
    .bc-client.selected { border-color: rgba(34,197,94,0.5); }
    .bc-f115 { border-color: rgba(239,68,68,0.15); }
    .bc-f115:hover { border-color: rgba(239,68,68,0.4); }
    .bc-f115::before { background: var(--gradient-red); }
    .bc-f115.selected { border-color: rgba(239,68,68,0.5); }
    .bc-f161 { border-color: rgba(245,158,11,0.15); }
    .bc-f161:hover { border-color: rgba(245,158,11,0.4); }
    .bc-f161::before { background: var(--gradient-amber); }
    .bc-f161.selected { border-color: rgba(245,158,11,0.5); }
    .bc-fssp { border-color: rgba(236,72,153,0.15); }
    .bc-fssp:hover { border-color: rgba(236,72,153,0.4); }
    .bc-fssp::before { background: var(--gradient-pink); }
    .bc-fssp.selected { border-color: rgba(236,72,153,0.5); }
    .bc-overdue { border-color: rgba(6,182,212,0.15); }
    .bc-overdue:hover { border-color: rgba(6,182,212,0.4); }
    .bc-overdue::before { background: var(--gradient-cyan); }
    .bc-overdue.selected { border-color: rgba(6,182,212,0.5); }
    .detail-panel {
      background: var(--bg-secondary);
      border: 2px solid var(--border-medium);
      border-radius: 28px;
      padding: 40px;
      margin-top: 20px;
      animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .detail-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 40px; right: 40px;
      height: 4px;
      background: var(--gradient-blue);
      border-radius: 0 0 4px 4px;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .detail-header {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 32px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .detail-header .big-icon {
      width: 72px; height: 72px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      flex-shrink: 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .detail-header h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .detail-header .desc {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
    }
    .panel-section {
      margin-bottom: 32px;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid;
      position: relative;
    }
    .panel-section h4 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sec-reasons {
      background: rgba(239,68,68,0.04);
      border-color: rgba(239,68,68,0.15);
    }
    .sec-reasons h4 { color: #f87171; }
    .sec-reasons h4::before { content: '⚠️'; font-size: 16px; }
    .sec-methods {
      background: rgba(59,130,246,0.04);
      border-color: rgba(59,130,246,0.15);
    }
    .sec-methods h4 { color: #60a5fa; }
    .sec-methods h4::before { content: '🔧'; font-size: 16px; }
    .sec-docs {
      background: rgba(139,92,246,0.04);
      border-color: rgba(139,92,246,0.15);
    }
    .sec-docs h4 { color: #a78bfa; }
    .sec-docs h4::before { content: '📋'; font-size: 16px; }
    .sec-bank {
      background: rgba(34,197,94,0.04);
      border-color: rgba(34,197,94,0.15);
    }
    .sec-bank h4 { color: #4ade80; }
    .sec-bank h4::before { content: '🏦'; font-size: 16px; }
    .sec-checklist {
      background: rgba(245,158,11,0.04);
      border-color: rgba(245,158,11,0.15);
    }
    .sec-checklist h4 { color: #fbbf24; }
    .sec-checklist h4::before { content: '✅'; font-size: 16px; }
    .sec-download {
      background: rgba(6,182,212,0.04);
      border-color: rgba(6,182,212,0.15);
    }
    .sec-download h4 { color: #22d3ee; }
    .sec-download h4::before { content: '⬇️'; font-size: 16px; }
    .reasons-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .reason-tag {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      color: #f87171;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
    }
    .method-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      transition: all 0.25s;
    }
    .method-item:hover {
      border-color: rgba(59,130,246,0.2);
      background: var(--bg-card-hover);
      transform: translateX(4px);
    }
    .method-item .method-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .method-item .method-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .method-item .method-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .meta-time { background: rgba(59,130,246,0.12); color: #60a5fa; }
    .meta-docs { background: rgba(139,92,246,0.12); color: #a78bfa; }
    .docs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .doc-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      font-size: 14px;
      color: #cbd5e1;
      transition: all 0.2s;
    }
    .doc-item:hover {
      border-color: rgba(139,92,246,0.2);
      transform: translateX(3px);
    }
    .doc-item .doc-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(139,92,246,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .bank-specific-info {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      padding: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
    }
    .bank-specific-info .bank-logo-sm {
      width: 50px; height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .bank-specific-info p {
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.7;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.2s;
    }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-item:hover { padding-left: 6px; }
    .checklist-item .checkbox {
      width: 24px; height: 24px;
      border: 2px solid var(--border-medium);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
      flex-shrink: 0;
      color: transparent;
    }
    .checklist-item.checked .checkbox {
      background: var(--gradient-green);
      border-color: transparent;
      color: white;
    }
    .checklist-item .check-text {
      font-size: 14px;
      color: #cbd5e1;
      transition: all 0.2s;
    }
    .checklist-item.checked .check-text {
      color: var(--text-muted);
      text-decoration: line-through;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-card);
      border-radius: 4px;
      margin-top: 18px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .progress-bar .progress-fill {
      height: 100%;
      background: var(--gradient-green);
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-text {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .download-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .download-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      color: inherit;
    }
    .download-card:hover {
      border-color: rgba(6,182,212,0.3);
      background: var(--bg-card-hover
